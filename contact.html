<head>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Juvy's Black Apothecary</h1>
    <p class="subtitle">Curative cures for the incurably damned.</p>

    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2 class="section-title">Summon Us</h2>

    <form action="#" method="post">
      <fieldset>
        <legend>Your details</legend>

        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject">
            <option value="product-question">Product Concerned</option>
            <option value="order-status">Inquiry</option>
            <option value="wholesale">Order Status</option>
            <option value="something-else">Another Matter</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
      </fieldset>

      <button type="submit">Send message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Juvy's Black Apothecary. All rights reserved in the shadows.</p>
    <nav>
      <a href="index.html">Products</a> | 
      <a href="about.html">About</a> | 
      <a href="contact.html">Contact</a>
    </nav>
  </footer>

</body>
</html>
