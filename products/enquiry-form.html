<head>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <header>
    <nav class="main-nav">
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../about.html">About</a></li>
        <li><a href="../contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Juvy's Black Apothecary</h1>

    <!-- order enquiry form section -->
    <section class="enquiry-section">
      <h3>Order Enquiry</h3>

      <form action="#" method="post">
        
        <!-- STEP 2: Selected Product Dropdown -->
        <div class="form-group">
          <label for="subject">Selected Product</label>
          <select id="subject" name="subject" required>
            <option value="cryptic">Cryptic Cold Brew</option>
            <option value="vampiric">Vampiric Velvet Latte</option>
            <option value="midnight">Midnight Mortem Mocha</option>
          </select>
        </div>

        <!-- quantity input -->
        <div class="form-group">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" name="quantity" min="1" max="15" value="1" required>
        </div>

        <!-- radio buttons for single-choice delivery method -->
        <fieldset>
          <legend>Delivery Method</legend>

          <div class="choice-group">
            <input type="radio" id="standard-courier" name="delivery_method" value="standard" checked>
            <label for="standard-courier">Standard Shadow Courier</label>
          </div>

          <div class="choice-group">
            <input type="radio" id="express-raven" name="delivery_method" value="express">
            <label for="express-raven">Express Raven Dispatch</label>
          </div>

          <div class="choice-group">
            <input type="radio" id="apothecary-pickup" name="delivery_method" value="pickup">
            <label for="apothecary-pickup">In-Person Apothecary Pickup</label>
          </div>
        </fieldset>

        <!-- checkboxes for multiple-choice optional extras -->
        <fieldset>
          <legend>Optional Extras</legend>

          <div class="choice-group">
            <input type="checkbox" id="gift-wrapping" name="extras" value="gift-wrapping">
            <label for="gift-wrapping">Gothic Gift Wrapping</label>
          </div>

          <div class="choice-group">
            <input type="checkbox" id="wax-seal" name="extras" value="wax-seal">
            <label for="wax-seal">Custom Wax Seal Certificate</label>
          </div>

          <div class="choice-group">
            <input type="checkbox" id="obsidian-coaster" name="extras" value="obsidian-coaster">
            <label for="obsidian-coaster">Include Obsidian Coaster</label>
          </div>
        </fieldset>

        <!-- contact email input -->
        <div class="form-group">
          <label for="contact-email">Contact Email</label>
          <input type="email" id="contact-email" name="contact_email" placeholder="name@domain.com" required>
        </div>

        <button type="submit">Send enquiry</button>

      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Juvy's Black Apothecary. All rights reserved in the shadows.</p>
    <nav>
      <a href="../index.html">Home</a> | 
      <a href="../about.html">About</a> | 
      <a href="../contact.html">Contact</a>
    </nav>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const selectedProduct = urlParams.get('product');

      if (selectedProduct) {
        const subjectDropdown = document.getElementById('subject');
        if (subjectDropdown) {
          subjectDropdown.value = selectedProduct;
        }
      }
    });
  </script>

</body>
</html>
